<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    />
    <title>StickyNotes Pro</title>
    <link rel="stylesheet" href="dashboard.css" />
    <script src="dashboard.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="dashboard-header">
        <div class="brand-block">
          <p class="eyebrow">StickyNotes Pro</p>
          <h1>Notes Dashboard</h1>
          <p class="header-copy">Find, organize, archive, and reopen your notes.</p>
        </div>

        <button class="primary-button" id="new-note-button" type="button">
          New Note
        </button>
      </header>

      <section class="controls-panel" aria-label="Note controls">
        <div class="search-control">
          <label for="note-search">Search notes</label>
          <input
            id="note-search"
            type="search"
            placeholder="Search title or content"
            autocomplete="off"
          />
        </div>

        <div class="control-group">
          <span class="control-label">Filter</span>
          <div class="segmented-control" role="group" aria-label="Filter notes">
            <button
              class="segment-button is-active"
              type="button"
              data-filter="active"
              aria-pressed="true"
            >
              Active
            </button>
            <button
              class="segment-button"
              type="button"
              data-filter="archived"
              aria-pressed="false"
            >
              Archived
            </button>
          </div>
        </div>

        <div class="sort-control">
          <label for="note-sort">Sort by</label>
          <select id="note-sort">
            <option value="modified">Date modified</option>
            <option value="created">Date created</option>
            <option value="title">Title</option>
          </select>
        </div>

        <div class="control-group">
          <span class="control-label">View</span>
          <div class="segmented-control" role="group" aria-label="Note view">
            <button
              class="segment-button is-active"
              type="button"
              data-view="grid"
              aria-pressed="true"
            >
              Grid
            </button>
            <button
              class="segment-button"
              type="button"
              data-view="list"
              aria-pressed="false"
            >
              List
            </button>
          </div>
        </div>
      </section>

      <section class="notes-section" aria-labelledby="notes-heading">
        <div class="section-heading">
          <div>
            <p class="section-kicker" id="notes-heading">Notes</p>
            <p class="note-count" id="note-count">0 notes</p>
          </div>
        </div>

        <div class="note-grid" id="note-grid" aria-live="polite"></div>

        <div class="empty-state" id="empty-state" hidden>
          <h2 id="empty-state-title">No notes found</h2>
          <p id="empty-state-copy">Create a note or adjust your search and filters.</p>
        </div>
      </section>

      <p class="operation-status" id="operation-status" role="status" aria-live="polite"></p>
    </main>

    <template id="note-card-template">
      <article class="note-card">
        <div class="note-card__body">
          <div class="note-card__heading">
            <h2 class="note-card__title" data-field="title"></h2>
            <span class="status-badge" data-field="status"></span>
          </div>

          <p class="note-card__preview" data-field="preview"></p>

          <dl class="note-card__metadata">
            <div>
              <dt>Created</dt>
              <dd data-field="created"></dd>
            </div>
            <div>
              <dt>Modified</dt>
              <dd data-field="modified"></dd>
            </div>
          </dl>
        </div>

        <footer class="note-card__actions">
          <button type="button" class="action-button" data-action="open">Open</button>
          <button type="button" class="action-button" data-action="duplicate">Duplicate</button>
          <button type="button" class="action-button" data-action="archive">Archive</button>
          <button type="button" class="action-button action-button--danger" data-action="delete">
            Permanently delete
          </button>
        </footer>
      </article>
    </template>
  </body>
</html>
