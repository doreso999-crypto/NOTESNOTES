<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    />
    <title>New Note</title>
    <link rel="stylesheet" href="note.css" />
    <script src="note.js" defer></script>
  </head>
  <body>
    <main class="sticky-note" id="sticky-note">
      <header class="note-header" id="note-header">
        <span class="note-name" id="note-name">New Note</span>

        <div class="window-controls" aria-label="Note controls">
          <button
            id="settings-button"
            class="window-button"
            type="button"
            aria-label="Open note settings"
            aria-expanded="false"
            title="Settings"
          >
            ⋯
          </button>
          <button
            id="close-button"
            class="window-button window-button--close"
            type="button"
            aria-label="Close note"
            title="Close"
          >
            ×
          </button>
        </div>

        <section class="settings-menu" id="settings-menu" aria-label="Note settings" hidden>
          <form id="rename-form" class="rename-form">
            <label for="rename-input">Rename note</label>
            <div class="rename-row">
              <input
                id="rename-input"
                type="text"
                maxlength="160"
                autocomplete="off"
              />
              <button type="submit" class="rename-button">Save</button>
            </div>
          </form>
        </section>
      </header>

      <section class="note-body" aria-label="Note content">
        <textarea
          id="note-content"
          class="note-content"
          placeholder="Write a note..."
          spellcheck="true"
        ></textarea>
      </section>
    </main>
  </body>
</html>
